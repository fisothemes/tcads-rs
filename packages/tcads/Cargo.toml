[package]
name = "tcads"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A Rust-native implementation of the TwinCAT ADS protocol"
keywords.workspace = true
categories.workspace = true
readme = "README.md"
version.workspace = true

[features]
default = ["blocking"]
blocking = ["tcads-io/blocking", "tcads-client/blocking"]
tokio = ["tcads-io/tokio", "tcads-client/tokio"]

[dependencies]
tcads-core = { workspace = true }
tcads-client = { workspace = true }
tcads-io = { workspace = true }
tcads-serde = { workspace = true }
tcads-server = { workspace = true }

[package.metadata.docs.rs]
all-features = true
