[package]
name = "tcads-client"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "High-level connection and device clients for the TwinCAT ADS protocol"
keywords.workspace = true
categories.workspace = true
readme = "README.md"
version.workspace = true

[features]
default = ["blocking"]
blocking = ["tcads-io/blocking"]
tokio = ["tcads-io/tokio", "dep:tokio"]

[dependencies]
chrono = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true }
tcads-core = { workspace = true }
tcads-io = { workspace = true }
tcads-serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "macros", "sync"], optional = true }

[package.metadata.docs.rs]
all-features = true
