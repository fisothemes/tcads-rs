[package]
name = "tcads-io"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Network transport layer for the TwinCAT ADS protocol"
keywords = ["twincat", "beckhoff", "ads"]
categories = ["api-bindings", "network-programming"]
readme = "README.md"

[features]
default = ["blocking"]
blocking = []
tokio = ["dep:tokio"]

[dependencies]
tcads-core = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "io-util", "sync", "time", "macros"], optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-test = { workspace = true }