[package]
name = "tcads-io"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Network transport layer for the TwinCAT ADS protocol"
keywords.workspace = true
categories.workspace = true
readme = "README.md"
version.workspace = true

[features]
default = ["blocking"]
blocking = []
tokio = ["dep:tokio"]
futures = ["dep:futures"]

[dependencies]
futures = { version = "0.3", optional = true, features = ["std", "io-compat"] }
tcads-core = { workspace = true }
tokio = { workspace = true, optional = true, features = ["net", "rt", "io-util", "sync", "time", "macros"],  }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-test = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true