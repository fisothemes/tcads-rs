[workspace]
resolver = "3"
members = [
    "examples",
    "packages/tcads",
    "packages/tcads-core",
    "packages/tcads-io",
    "packages/tcads-client",
    "packages/tcads-serde",
    "packages/tcads-server",
]

[workspace.package]
authors = ["Goodwill Mzumala <fisothemes@egmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/fisothemes/tcads-rs"

[workspace.dependencies]
bitflags = "2"
chrono = "0.4"
encoding_rs = "0.8"
indexmap = "2"
rand = "0.10.0"
serde = "1"
serde_json = "1"
tcads = { path = "packages/tcads" }
tcads-client = { path = "packages/tcads-client" }
tcads-core = { path = "packages/tcads-core" }
tcads-io = { path = "packages/tcads-io" }
tcads-serde = { path = "packages/tcads-serde" }
tcads-server = { path = "packages/tcads-server" }
tokio = "1"
tokio-test = "0.4"
thiserror = "2"
